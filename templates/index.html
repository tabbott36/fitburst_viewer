<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>fitburst GUI</title>

<style>
body {
  font-family: monospace;
  background: #0d1117;
  color: #e6edf3;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2rem;
}
.title {
  margin: 0 0 1rem 0;
  font-size: 2.1rem;
  line-height: 1.1;
  letter-spacing: 0.02em;
  color: #f0f6fc;
}
.panel {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 10px;
  padding: 1rem;
  width: 980px;
  max-width: calc(100vw - 2rem);
  box-sizing: border-box;
  margin-bottom: 12px;
}
canvas { display: block; }
.plot-wrap {
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.y-axis-label {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  color: #c9d1d9;
  letter-spacing: 0.5px;
}
.y-ticks {
  height: 300px;
  min-width: 62px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: flex-end;
  color: #9da7b2;
  font-size: 12px;
}
.plot-area {
  flex: 1;
  display: flex;
  flex-direction: column;
}
.top-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 6px;
}
.y-axis-spacer {
  width: 18px;
}
.y-ticks-spacer {
  width: 62px;
}
.snr-col {
  width: 700px;
}
.main-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.dynspec-col {
  width: 700px;
  display: flex;
  flex-direction: column;
}
#snr-cv {
  width: 700px;
  height: 110px;
}
#cv {
  width: 700px;
  height: 300px;
  cursor: crosshair;
}
#spec-cv {
  width: 120px;
  height: 300px;
}
.mini-label {
  margin-bottom: 4px;
  color: #c9d1d9;
  font-size: 12px;
}
.right-label {
  margin-top: 6px;
  color: #c9d1d9;
  font-size: 12px;
  text-align: center;
}
.x-ticks {
  margin-top: 6px;
  display: flex;
  justify-content: space-between;
  color: #9da7b2;
  font-size: 12px;
}
.x-axis-label {
  margin-top: 8px;
  text-align: center;
  color: #c9d1d9;
}
.btn {
  margin-top: 10px;
  padding: 6px 14px;
  border: 1px solid #30363d;
  background: transparent;
  color: white;
  cursor: pointer;
}
.btn + .btn {
  margin-left: 8px;
}
.btn:hover { background: #21262d; }
.live {
  margin-top: 10px;
  color: #9da7b2;
}
</style>
</head>

<body>

<h1 class="title">Fitburst Viewer</h1>

<div class="panel">
  <div class="plot-wrap">
    <div class="plot-area">
      <div class="top-row">
        <div id="y-axis-spacer" class="y-axis-spacer"></div>
        <div id="y-ticks-spacer" class="y-ticks-spacer"></div>
        <div class="snr-col">
          <div class="mini-label">SNR vs Time</div>
          <canvas id="snr-cv"></canvas>
        </div>
      </div>
      <div class="main-row">
        <div id="y-axis-label" class="y-axis-label">Frequency (MHz)</div>
        <div id="y-ticks" class="y-ticks"></div>
        <div class="dynspec-col">
          <canvas id="cv"></canvas>
          <div id="x-ticks" class="x-ticks"></div>
          <div class="x-axis-label">Time (ms)</div>
        </div>
        <div>
          <canvas id="spec-cv"></canvas>
          <div class="right-label">Spectrum</div>
        </div>
      </div>
    </div>
  </div>
  <button class="btn" onclick="runFit()">Run fit.py with selection</button>
  <button class="btn" onclick="resetSelection()">Reset selection</button>
  <button class="btn" onclick="undoSelection()">Undo</button>
  <pre id="live" class="live"></pre>
</div>

<div class="panel">
  <pre id="out"></pre>
</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const snrCv = document.getElementById('snr-cv');
const snrCtx = snrCv.getContext('2d');
const specCv = document.getElementById('spec-cv');
const specCtx = specCv.getContext('2d');
const xTicksEl = document.getElementById('x-ticks');
const yTicksEl = document.getElementById('y-ticks');
const yAxisLabelEl = document.getElementById('y-axis-label');
const yAxisSpacerEl = document.getElementById('y-axis-spacer');
const yTicksSpacerEl = document.getElementById('y-ticks-spacer');

const W = 700, H = 300, TOP_H = 110, SPEC_W = 120;
cv.width = W;
cv.height = H;
snrCv.width = W;
snrCv.height = TOP_H;
specCv.width = SPEC_W;
specCv.height = H;

let ds = null;
let tMin, tMax, fMin, fMax;
const DYNSPEC_PERCENTILE_LOW = 1.0;
const DYNSPEC_PERCENTILE_HIGH = 99.0;

/* selection state */
let phase = 'arrival';
let arrivalT = null;
let widthStart = null;
let widthEnd = null;
let dragging = false;
const selectionHistory = [];

function snapshotSelection() {
  return {
    phase,
    arrivalT,
    widthStart,
    widthEnd,
  };
}

function restoreSelection(state) {
  phase = state.phase;
  arrivalT = state.arrivalT;
  widthStart = state.widthStart;
  widthEnd = state.widthEnd;
  dragging = false;
}

function pushSelectionHistory() {
  selectionHistory.push(snapshotSelection());
}

function formatNum(v) {
  return Number.isFinite(v) ? v.toFixed(4) : 'n/a';
}

function currentWidth() {
  if (widthStart === null || widthEnd === null) return null;
  return Math.abs(widthEnd - widthStart);
}

function updateLiveReadout() {
  const live = document.getElementById('live');
  const arrivalText = arrivalT === null ? 'not selected' : formatNum(arrivalT);
  const widthVal = currentWidth();
  const widthText = widthVal === null ? 'not selected' : formatNum(widthVal);
  const phaseText = phase === 'arrival' ? 'Click to set arrival time' : 'Click-drag to set width';

  live.textContent =
    `Arrival time: ${arrivalText}\n` +
    `Width: ${widthText}\n` +
    `Mode: ${phaseText}`;
}

function percentile(sortedVals, p) {
  if (sortedVals.length === 0) return NaN;
  const clamped = Math.min(Math.max(p, 0), 100);
  const idx = (clamped / 100) * (sortedVals.length - 1);
  const lo = Math.floor(idx);
  const hi = Math.ceil(idx);
  if (lo === hi) return sortedVals[lo];
  const t = idx - lo;
  return sortedVals[lo] * (1 - t) + sortedVals[hi] * t;
}

function computeIntensityRange(data) {
  const vals = [];
  for (let r = 0; r < data.length; r++) {
    const row = data[r];
    for (let c = 0; c < row.length; c++) {
      const v = Number(row[c]);
      if (Number.isFinite(v)) vals.push(v);
    }
  }

  if (vals.length === 0) {
    return { vmin: 0, vmax: 1 };
  }

  vals.sort((a, b) => a - b);
  let vmin = percentile(vals, DYNSPEC_PERCENTILE_LOW);
  let vmax = percentile(vals, DYNSPEC_PERCENTILE_HIGH);

  if (!Number.isFinite(vmin)) vmin = vals[0];
  if (!Number.isFinite(vmax)) vmax = vals[vals.length - 1];
  if (vmax <= vmin) {
    vmax = vmin + 1;
  }

  return { vmin, vmax };
}

function computeProfiles(data) {
  const rows = data.length;
  const cols = data[0].length;
  const timeSeries = Array.from({ length: cols }, () => 0);
  const timeCounts = Array.from({ length: cols }, () => 0);
  const spectrum = Array.from({ length: rows }, () => 0);
  const specCounts = Array.from({ length: rows }, () => 0);

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const v = Number(data[r][c]);
      if (!Number.isFinite(v)) continue;
      timeSeries[c] += v;
      timeCounts[c] += 1;
      spectrum[r] += v;
      specCounts[r] += 1;
    }
  }

  for (let c = 0; c < cols; c++) {
    if (timeCounts[c] > 0) timeSeries[c] /= timeCounts[c];
  }
  for (let r = 0; r < rows; r++) {
    if (specCounts[r] > 0) spectrum[r] /= specCounts[r];
  }

  const valid = timeSeries.filter(Number.isFinite);
  const mean = valid.length ? valid.reduce((a, b) => a + b, 0) / valid.length : 0;
  const variance = valid.length
    ? valid.reduce((acc, v) => acc + (v - mean) * (v - mean), 0) / valid.length
    : 0;
  const sigma = Math.sqrt(variance) || 1;
  const snrSeries = timeSeries.map(v => Number.isFinite(v) ? (v - mean) / sigma : 0);

  return { snrSeries, spectrum };
}

function drawSnrPanel(values) {
  snrCtx.clearRect(0, 0, W, TOP_H);
  if (!values || values.length < 2) return;

  let minV = 0;
  let maxV = 0;
  for (let i = 0; i < values.length; i++) {
    const v = values[i];
    if (!Number.isFinite(v)) continue;
    if (v < minV) minV = v;
    if (v > maxV) maxV = v;
  }
  const range = maxV - minV || 1;

  const yAt = v => TOP_H - 1 - ((v - minV) / range) * (TOP_H - 1);
  const xAt = i => (i / (values.length - 1)) * (W - 1);

  const yZero = yAt(0);
  snrCtx.strokeStyle = 'rgba(157,167,178,0.5)';
  snrCtx.beginPath();
  snrCtx.moveTo(0, yZero);
  snrCtx.lineTo(W, yZero);
  snrCtx.stroke();

  snrCtx.strokeStyle = '#58a6ff';
  snrCtx.lineWidth = 1.5;
  snrCtx.beginPath();
  snrCtx.moveTo(xAt(0), yAt(values[0]));
  for (let i = 1; i < values.length; i++) {
    snrCtx.lineTo(xAt(i), yAt(values[i]));
  }
  snrCtx.stroke();
}

function drawSpectrumPanel(values) {
  specCtx.clearRect(0, 0, SPEC_W, H);
  if (!values || values.length < 2) return;

  let minV = Infinity;
  let maxV = -Infinity;
  for (let i = 0; i < values.length; i++) {
    const v = values[i];
    if (!Number.isFinite(v)) continue;
    if (v < minV) minV = v;
    if (v > maxV) maxV = v;
  }
  if (!Number.isFinite(minV) || !Number.isFinite(maxV)) {
    minV = 0;
    maxV = 1;
  }
  const range = maxV - minV || 1;

  const xAt = v => ((v - minV) / range) * (SPEC_W - 1);
  const yAt = i => (i / (values.length - 1)) * (H - 1);

  specCtx.strokeStyle = '#f2cc60';
  specCtx.lineWidth = 1.5;
  specCtx.beginPath();
  specCtx.moveTo(xAt(values[0]), yAt(0));
  for (let i = 1; i < values.length; i++) {
    specCtx.lineTo(xAt(values[i]), yAt(i));
  }
  specCtx.stroke();
}

function formatTick(v) {
  if (!Number.isFinite(v)) return 'n/a';
  const av = Math.abs(v);
  if (av >= 1000) return v.toFixed(0);
  if (av >= 100) return v.toFixed(1);
  if (av >= 1) return v.toFixed(2);
  return v.toFixed(3);
}

function makeTicks(minVal, maxVal, count) {
  if (!Number.isFinite(minVal) || !Number.isFinite(maxVal) || count < 2) {
    return [0, 1];
  }
  if (maxVal === minVal) {
    return Array.from({ length: count }, () => minVal);
  }
  return Array.from({ length: count }, (_, i) => {
    const t = i / (count - 1);
    return minVal + t * (maxVal - minVal);
  });
}

function renderAxisTicks() {
  const xTicks = makeTicks(tMin, tMax, 6);
  const yTicks = makeTicks(fMax, fMin, 6);

  xTicksEl.innerHTML = xTicks
    .map(v => `<span>${formatTick(v)}</span>`)
    .join('');

  yTicksEl.innerHTML = yTicks
    .map(v => `<span>${formatTick(v)}</span>`)
    .join('');

  syncPanelAlignment();
}

function syncPanelAlignment() {
  if (!yAxisLabelEl || !yAxisSpacerEl || !yTicksEl || !yTicksSpacerEl) return;
  yAxisSpacerEl.style.width = `${Math.ceil(yAxisLabelEl.getBoundingClientRect().width)}px`;
  yTicksSpacerEl.style.width = `${Math.ceil(yTicksEl.getBoundingClientRect().width)}px`;
}

function axisMaxFromBin0(bin0, resolution, count) {
  if (!Number.isFinite(bin0) || !Number.isFinite(resolution) || !Number.isFinite(count) || count < 1) {
    return null;
  }
  return bin0 + resolution * (count - 1);
}

/* ── VIRIDIS ── */
function cmap(v) {
  const viridis = [
    [68,1,84],[71,44,122],[59,81,139],[44,113,142],
    [33,144,141],[39,173,129],[92,200,99],[170,220,50],[253,231,37]
  ];
  const n = viridis.length - 1;
  const x = Math.min(Math.max(v,0),1) * n;
  const i = Math.floor(x);
  const t = x - i;
  if (i >= n) return viridis[n];
  const c0 = viridis[i], c1 = viridis[i+1];
  return [
    c0[0] + t*(c1[0]-c0[0]),
    c0[1] + t*(c1[1]-c0[1]),
    c0[2] + t*(c1[2]-c0[2])
  ];
}

/* ── LOAD DATA ── */
async function loadObservation() {
  const out = document.getElementById('out');
  try {
    const res = await fetch('observation.json');
    if (!res.ok) {
      out.textContent = `Failed to load observation.json (${res.status})`;
      return;
    }

    const json = await res.json();

    // Accept either object schema {metadata, dynspec} or a raw 2D array.
    let data;
    if (Array.isArray(json)) {
      data = json;
      const rows = data.length;
      const cols = rows > 0 && Array.isArray(data[0]) ? data[0].length : 0;
      tMin = 0;
      tMax = Math.max(cols - 1, 1);
      fMin = 0;
      fMax = Math.max(rows - 1, 1);
    } else {
      data = json.dynspec;
      const md = json.metadata || {};

      // New observation schema: times_bin0/res_time/num_time and freqs_bin0/res_freq/num_freq.
      const tMinMeta = 0;
      const tMaxMeta = axisMaxFromBin0(0, Number(md.res_time) * 1000, Number(md.num_time));
      const fMinMeta = Number(md.freqs_bin0);
      const fMaxMeta = axisMaxFromBin0(Number(md.freqs_bin0), Number(md.res_freq), Number(md.num_freq));

      // Backward-compatible fallbacks for older metadata names.
      tMin = Number.isFinite(tMinMeta) ? tMinMeta : (md.t_min ?? 0);
      tMax = Number.isFinite(tMaxMeta) ? tMaxMeta : (md.t_max ?? 1);
      fMin = Number.isFinite(fMinMeta) ? fMinMeta : (md.f_min ?? 0);
      fMax = Number.isFinite(fMaxMeta) ? fMaxMeta : (md.f_max ?? 1);
    }

    if (!Array.isArray(data) || data.length === 0 || !Array.isArray(data[0])) {
      out.textContent = 'observation.json must contain a 2D numeric array in dynspec.';
      return;
    }

    const intensityRange = computeIntensityRange(data);
    const profiles = computeProfiles(data);
    ds = {
      data,
      rows: data.length,
      cols: data[0].length,
      vmin: intensityRange.vmin,
      vmax: intensityRange.vmax,
      snrSeries: profiles.snrSeries,
      spectrum: profiles.spectrum,
    };
    draw();
    renderAxisTicks();
    updateLiveReadout();
  } catch (err) {
    out.textContent = `Failed to parse observation.json: ${err}`;
  }
}

/* ── COORDS ── */
function xToT(x) {
  return tMin + (x / W) * (tMax - tMin);
}
function tToX(t) {
  return (t - tMin) / (tMax - tMin) * W;
}

/* ── DRAW ── */
function draw() {
  if (!ds) return;

  const {data, rows, cols, vmin, vmax, snrSeries, spectrum} = ds;
  const scale = vmax - vmin || 1;

  // Draw at native dynspec resolution first, then scale up without smoothing
  // so bins stay contiguous with no visual gaps.
  const srcCanvas = document.createElement('canvas');
  srcCanvas.width = cols;
  srcCanvas.height = rows;
  const srcCtx = srcCanvas.getContext('2d');
  const srcImg = srcCtx.createImageData(cols, rows);

  for (let r=0;r<rows;r++){
    for (let c=0;c<cols;c++){
      const val = Number(data[r][c]);
      const normalized = Number.isFinite(val) ? (val - vmin) / scale : 0;
      const [R,G,B] = cmap(normalized);

      const i = (r * cols + c) * 4;
      srcImg.data[i] = R;
      srcImg.data[i + 1] = G;
      srcImg.data[i + 2] = B;
      srcImg.data[i + 3] = 255;
    }
  }

  srcCtx.putImageData(srcImg, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(srcCanvas, 0, 0, W, H);

  drawSnrPanel(snrSeries);
  drawSpectrumPanel(spectrum);

  /* mirror selection overlays on SNR panel */
  if (widthStart !== null && widthEnd !== null) {
    const sx1 = tToX(widthStart);
    const sx2 = tToX(widthEnd);
    snrCtx.fillStyle = 'rgba(255,77,79,0.25)';
    snrCtx.fillRect(Math.min(sx1, sx2), 0, Math.abs(sx2 - sx1), TOP_H);
  }
  if (arrivalT !== null) {
    const sx = tToX(arrivalT);
    snrCtx.strokeStyle = '#ff4d4f';
    snrCtx.beginPath();
    snrCtx.moveTo(sx, 0);
    snrCtx.lineTo(sx, TOP_H);
    snrCtx.stroke();
  }

  /* arrival line */
  if (arrivalT !== null) {
    const x = tToX(arrivalT);
    ctx.strokeStyle = '#ff4d4f';
    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,H);
    ctx.stroke();
  }

  /* width shading */
  if (widthStart !== null && widthEnd !== null) {
    const x1 = tToX(widthStart);
    const x2 = tToX(widthEnd);
    ctx.fillStyle = 'rgba(255,77,79,0.25)';
    ctx.fillRect(Math.min(x1,x2),0,Math.abs(x2-x1),H);
  }
}

/* ── MOUSE ── */
function getCanvasTime(canvas, evt) {
  const rect = canvas.getBoundingClientRect();
  const x = (evt.clientX - rect.left) * (canvas.width / rect.width);
  return xToT(x);
}

function handleSelectionStart(t) {
  if (phase === 'arrival') {
    pushSelectionHistory();
    arrivalT = t;
    phase = 'width';
  } else {
    pushSelectionHistory();
    dragging = true;
    widthStart = t;
    widthEnd = widthStart;
  }
  draw();
  updateLiveReadout();
}

function handleSelectionDrag(t) {
  if (!dragging) return;
  widthEnd = t;
  draw();
  updateLiveReadout();
}

cv.addEventListener('mousedown', e => {
  handleSelectionStart(getCanvasTime(cv, e));
});

snrCv.addEventListener('mousedown', e => {
  handleSelectionStart(getCanvasTime(snrCv, e));
});

cv.addEventListener('mousemove', e => {
  handleSelectionDrag(getCanvasTime(cv, e));
});

snrCv.addEventListener('mousemove', e => {
  handleSelectionDrag(getCanvasTime(snrCv, e));
});

window.addEventListener('mouseup', () => {
  dragging = false;
  updateLiveReadout();
});

function resetSelection() {
  phase = 'arrival';
  arrivalT = null;
  widthStart = null;
  widthEnd = null;
  dragging = false;
  draw();
  updateLiveReadout();
}

function undoSelection() {
  if (selectionHistory.length === 0) return;
  const prev = selectionHistory.pop();
  restoreSelection(prev);
  draw();
  updateLiveReadout();
}

/* ── SEND TO PYTHON ── */
async function runFit() {
  const out = document.getElementById('out');

  if (arrivalT === null || widthStart === null || widthEnd === null) {
    out.textContent = "Select arrival time and width first.";
    return;
  }

  const width = Math.abs(widthEnd - widthStart);

  const payload = {
    arrival_time: arrivalT,
    width: width
  };

  out.textContent = "Running fit.py...";

  const res = await fetch('/run-fit', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  });

  const body = await res.json();
  if (!res.ok) {
    const err = body.error || 'Unknown error';
    const stderr = body.stderr ? `\n${body.stderr}` : '';
    out.textContent = `Error: ${err}${stderr}`;
    return;
  }

  out.textContent = body.output || '';
}

updateLiveReadout();
loadObservation();
window.addEventListener('resize', syncPanelAlignment);
</script>

</body>
</html>
